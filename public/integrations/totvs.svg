<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
<defs>
<style>
.totvs-text { font-family: Arial, sans-serif; font-size: 64px; font-weight: 700; letter-spacing: 2px; }
</style>
</defs>

<!-- TOTVS Logo - Circular design with text -->
<circle cx="80" cy="100" r="60" fill="none" stroke="#0099CC" stroke-width="8"/>
<circle cx="80" cy="100" r="45" fill="none" stroke="#0099CC" stroke-width="3"/>

<!-- Inner design elements -->
<rect x="65" y="85" width="30" height="30" fill="#0099CC" opacity="0.8"/>

<!-- Text "TOTVS" -->
<text x="160" y="120" class="totvs-text" fill="#0099CC">TOTVS</text>
</svg>
