<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
<defs>
<style>
.senior-text { font-family: Arial, sans-serif; font-size: 60px; font-weight: 600; }
</style>
</defs>

<!-- Senior Logo - Stylized S with curves -->
